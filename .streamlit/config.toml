[server]
headless = true
maxUploadSize = 20
maxMessageSize = 64
fileWatcherType = "none"
enableStaticServing = false

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"
toolbarMode = "minimal"
showSidebarNavigation = false

[theme]
base = "light"
primaryColor = "#0f0f0f"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f6f3"
textColor = "#0f0f0f"
font = "sans serif"
