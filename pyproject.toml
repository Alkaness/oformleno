[build-system]
requires = ["setuptools>=84.2,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "oformleno"
version = "0.1.0"
description = "Перевірка оформлення студентських робіт за методичкою кафедри"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["python-docx>=1.2,<2"]
classifiers = ["Private :: Do Not Upload"]

[dependency-groups]
dev = ["pytest>=9.1,<10", "ruff>=0.17,<0.18", "setuptools>=84.2,<85"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
