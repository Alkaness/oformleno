[build-system]
requires = ["setuptools>=84.2,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "oformleno"
version = "0.1.0"
description = "Перевірка оформлення студентських робіт за методичкою кафедри"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-docx>=1.2,<2",
    "pydantic>=2.12,<3",
    "PyYAML>=6.0.2,<7",
    "typer>=0.16,<1",
    "streamlit>=1.67,<1.68",
]
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
oformleno = "oformleno.cli:main"

[dependency-groups]
dev = ["pytest>=9.1,<10", "ruff>=0.17,<0.18", "setuptools>=84.2,<85"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/oformleno/rulesets" = ["rulesets/*.yaml"]

[tool.setuptools.package-data]
oformleno = ["web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
